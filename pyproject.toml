[tool.poetry]
name = "kt-assistant"
version = "0.1.0"
description = "AI-based Knowledge Transfer Assistant"
authors = ["Nikhil Maheshwari <[nikhilmaheshwariii10@gmail.com]>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
litellm = "1.81.14"
loguru = "0.7.3"
markdown = "3.10.2"
markdown-pdf = "1.13.1"
pandas = "2.3.3"
playwright = "1.61.0"
pydantic = "2.12.5"
pydantic-settings = "2.13.1"
python-dotenv = "1.2.1"
pypdf = "4.3.1"
python-docx = "1.2.0"
qdrant-client = "1.17.0"
requests = "2.32.5"
sqlalchemy = "2.0.46"
streamlit = "1.54.0"
supabase = "2.28.0"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
python-multipart = ">=0.0.9"
fastembed = "0.8.0"
apscheduler = "3.10.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

