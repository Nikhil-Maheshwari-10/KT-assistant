[tool.poetry]
name = "kt-assistant"
version = "0.1.0"
description = "AI-based Knowledge Transfer Assistant"
authors = ["Nikhil Maheshwari <[nikhilmaheshwariii10@gmail.com]>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
streamlit = "^1.31.0"
litellm = "^1.28.0"
supabase = "^2.3.0"
qdrant-client = "^1.7.3"
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.27"
playwright = "^1.40.0"
markdown = "^3.5.0"
loguru = "^0.7.2"
pypdf = "^4.0.0"
requests = "^2.31.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
python-multipart = "^0.0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

